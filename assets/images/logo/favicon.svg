<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1F24"/>
      <stop offset="100%" stop-color="#140E12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7AD"/>
      <stop offset="35%" stop-color="#D4B96A"/>
      <stop offset="70%" stop-color="#B89A5A"/>
      <stop offset="100%" stop-color="#8E6A1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#D4B96A" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Crown Icon -->
  <path d="M 160,200 L 200,240 L 256,160 L 312,240 L 352,200 L 336,280 L 176,280 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="160" cy="190" r="10" fill="#F7E7AD"/>
  <circle cx="256" cy="148" r="12" fill="#F7E7AD"/>
  <circle cx="352" cy="190" r="10" fill="#F7E7AD"/>

  <!-- Brand Typography -->
  <text x="256" y="360" font-family="'Playfair Display', Georgia, serif" font-weight="bold" font-size="92" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">RaRa</text>
  <text x="256" y="415" font-family="'Montserrat', sans-serif" font-weight="700" font-size="28" fill="#F4ECE1" text-anchor="middle" letter-spacing="6">PÂTISSERIE</text>
</svg>
